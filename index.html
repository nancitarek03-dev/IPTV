<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IPTV UI</title>
  <link rel="stylesheet" href="css/project2.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
</head>
<body>
<div class="container"> 
    <div class="top-bar">
        <div class="logo">
            <div class="tv">
            <span class="iptv">IPTV</span>
            </div>
            <span class="smarters">SMARTERS</span>
        </div>
        <div class="right">
            <div class="time">10:45</div>
            <div class="date">August 07,2019</div>

            <div class="status-icons">
                <div class="dot"></div>
                  <i class=" fa-regular fa-bell"></i>
                  <!-- <span>🔔</span> -->
                  <i class=" fa-regular fa-user"></i>
                  <!-- <span>👤</span> -->
                  <i class="fa-solid fa-video"></i>
                  <!-- <span>🎥</span> -->
                  <i class="fa-solid fa-gear"></i>
                  <!-- <span>⚙️</span> -->
                  <i class="fa-solid fa-users"></i>
                  <!-- <span>👥</span> -->
            </div>
        </div>
        </div>

  <div class="grid">

    <div class="card live">
      <i class="fa-solid fa-tv"></i>
      <!-- <span>📺</span> -->
      <p>LIVE TV</p>
    </div>

    <div class="card movies">
      <div class="play-btn">
        <i class="fa-solid fa-play"></i>
      </div>
      <!-- <span>▶️</span> -->
      <p>MOVIES</p>
    </div>

    <div class="card series">
      <i class="fa-solid fa-film"></i>
      <!-- <span>🎬</span> -->
      <p>SERIES</p>
    </div>

    <div class="small-buttons">
            <div class="small">
              <i class="fa-solid fa-book-open"></i>
            <!-- <span>📖</span> -->
            <p>INSTALL EPG</p> 
            </div>
            <div class="small">
              <i class="fa-solid fa-table-cells"></i>
            <!-- <span>⏹️</span> -->
            <p>MULTI-SCREEN</p>
            </div>
            <div class="small">
              <i class="fa-solid fa-clock-rotate-left"></i>
            <!-- <span>🕓</span> -->
            <p>CATCH UP</p>
            </div>
        </div>

  </div>

  <div class="footer">
    <span>Expiration : November 23, 2019</span>
    <span>Logged in : demo</span>
  </div>

</div>

</body>
</html>
